defaults:
  - logger: logger
  - arch: anakin
  - system: ppo/ff_ippo
  - network: mlp  # [mlp, cnn]
  - env: multiwalker  # [cleaner, connector, vector-connector, gigastep, lbf, mabrax, matrax, rware, smax, mpe]
  - _self_

logger:
  use_neptune: True
  kwargs:
    neptune_project: itechs-MA/Mava-Multiwalker
    neptune_tag: [mw-ippo-ff]
  
  checkpointing:
    save_model: True # Whether to save model checkpoints.
    save_args:
      save_interval_steps: 1000000 # Number of steps between saving checkpoints.
      max_to_keep: 3 # Maximum number of checkpoints to keep.
      keep_period: ~ # Don't delete any checkpoint where step % keep_period == 0
      checkpoint_uid: ~ # Unique identifier for checkpoint to save. Defaults to timestamp

    # load_model: False # Whether to load model checkpoints.
    # load_args:
    #   checkpoint_uid: "" # Unique identifier for checkpoint to load.
hydra:
  searchpath:
    - file://mava/configs
